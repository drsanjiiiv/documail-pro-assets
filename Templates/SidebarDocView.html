<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body {
      padding: 12px;
      font-family: 'Roboto', sans-serif;
    }

    .card {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 20px;
    }

    h3 {
      margin-top: 0;
      color: #1a73e8;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 11px;
      color: #3c4043;
    }

    select,
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      height: 30px;
    }

    .radio-group {
      margin: 8px 0 12px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .radio-group label {
      display: inline-flex;
      align-items: center;
      font-weight: normal;
      cursor: pointer;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    .link-card {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .link-card h3 {
      margin: 0 0 6px 0;
      color: #1a73e8;
      font-size: 13px;
      font-weight: 600;
    }

    .link-card p {
      margin: 0 0 10px 0;
      font-size: 11px;
      color: #5f6368;
      line-height: 1.5;
    }

    .link-card .linked-name {
      font-weight: 600;
      color: #137333;
    }

    .link-card .link-status {
      font-size: 11px;
      color: #5f6368;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .link-card .btn-blue {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .link-card .btn-blue:hover {
      background: #04fbbc;
      color: #1a73e8;
      transform: scale(1.02);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .link-card .btn-blue:active {
      transform: scale(0.97);
      background: #e6a800;
    }

    .action {
      padding: 8px 20px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.action:hover {
      background: #04fbbc !important;
      color: #1a73e8 !important;
      transform: scale(1.02);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    button.action:active {
      transform: scale(0.97);
      background: #e6a800 !important;
    }

    .link-card .link-error {
      display: none;
      background: #fce8e6;
      color: #c5221f;
      border-left: 4px solid #c5221f;
      padding: 8px 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 11px;
    }

    .link-card .link-success {
      display: none;
      background: #e6f4ea;
      color: #137333;
      border-left: 4px solid #137333;
      padding: 8px 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div id="main-panel">

    <div class="link-card" id="link-card">
      <h3>🔗 Linked Spreadsheet</h3>
      <div class="link-status" id="link-status">Loading link status...</div>
      <button type="button" class="btn-blue" id="link-picker-btn" onclick="launchSpreadsheetPicker()">📂
        Browse Spreadsheet</button>
      <div class="link-error" id="link-error"></div>
      <div class="link-success" id="link-success"></div>
    </div>

    <div class="card" id="smart-variable-card">
      <h3>Insert Smart Variable</h3>

      <div class="form-group">
        <label>Please choose a variable</label>
        <select id="smart-dropdown" class="header-dropdown"></select>
        <p style="font-size: 11px; color: #5f6368; margin: 4px 0 0 0;">💡 Use in a paragraph or table row</p>
      </div>

      <label>Display this only when...</label>
      <div class="radio-group">
        <label><input type="radio" name="display-type" value="always" checked onclick="toggleConditional(false)">
          Always</label>
        <label><input type="radio" name="display-type" value="conditional" onclick="toggleConditional(true)"> Only
          when...</label>
      </div>

      <div id="conditional-fields" class="hidden">
        <hr>
        <div class="form-group">
          <label>Where should this apply?</label>
          <div class="radio-group">
            <label><input type="radio" name="target-type" value="paragraph" checked> Paragraph Text (Simple)</label>
            <label><input type="radio" name="target-type" value="table"> Table Row (Advanced)</label>
          </div>
        </div>

        <div class="form-group">
          <label>When should this show?</label>
          <select id="cond-operator" onchange="toggleValueBox()">
            <option value="==">Matches exactly (==)</option>
            <option value="!=">Does not match (!=)</option>
            <option value="contains">Contains</option>
            <option value="notcontains">Does Not Contain</option>
            <option value="startswith">Starts With</option>
            <option value="endswith">Ends With</option>
            <option value="empty">Is Empty</option>
            <option value="notempty">Is Not Empty</option>
            <option value=">">Greater Than (&gt;)</option>
            <option value="<">Less Than (&lt;)</option>
            <option value=">=">Greater Than or Equal (&gt;=)</option>
            <option value="<=">Less Than or Equal (&lt;=)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Value to Compare</label>
          <input type="text" id="cond-value" placeholder="e.g., Shalex">
        </div>

        <hr>
        <label>What should appear? Choose one option</label>
        <select id="content-type" onchange="updateContentInput()">
          <option value="variable">Variable</option>
          <option value="text">Custom Text</option>
          <option value="blank">Blank / Placeholder</option>
        </select>

        <div id="content-input-container" style="margin-top:8px;">
          <!-- Dynamic input populated by updateContentInput -->
        </div>
      </div>

      <button class="action" onclick="handleSmartInsert()">Insert</button>
    </div>
  </div>

  <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #dadce0; font-size: 11px; color: #9aa0a6;">
    🔒 Data stays in your Google Workspace, nothing stored externally.
    <a href="https://apps.pwmai.com/privacy-policy/" target="_blank">Privacy Policy</a>
  </div>

  <script src="https://apis.google.com/js/api.js"></script>

  <script>
    var pickerApiLoaded = false;
    var oAuthTokenSecureStr = "";

    function showError(err) {
      var mainPanel = document.getElementById('main-panel');
      var existingHint = document.getElementById('variables-hint');
      if (!existingHint) {
        var hint = document.createElement('div');
        hint.id = 'variables-hint';
        hint.className = 'card';
        hint.style.textAlign = 'center';
        hint.innerHTML =
          '<h3 style="margin:0 0 8px 0;color:#5f6368;">📝 Insert Smart Variable</h3>' +
          '<p style="font-size:12px;color:#9aa0a6;">Link a spreadsheet above to load available variables.</p>';
        mainPanel.appendChild(hint);
      }
      var smartCard = document.getElementById('smart-variable-card');
      if (smartCard) smartCard.style.display = 'none';
    }

    // Populate dropdowns (Assume getSheetHeaders is available)
    window.onload = () => {
      google.script.run
        .withSuccessHandler(renderLinkStatus)
        .withFailureHandler(() => {})
        .GET_LINK_STATUS();
      google.script.run
        .withSuccessHandler(populateDropdowns)
        .withFailureHandler(showError)
        .getSheetHeaders();
    };

    function populateDropdowns(headers) {
      const selects = document.querySelectorAll('select.header-dropdown');
      selects.forEach(s => {
        s.innerHTML = '';
        headers.forEach(h => {
          let o = document.createElement('option'); o.value = h; o.textContent = h; s.appendChild(o);
        });
      });
      updateContentInput();
    }

    // ============================================================
    // LINK SPREADSHEET (GOOGLE PICKER) - Plan A
    // ============================================================

    function initiateNativeGooglePickerLibraries() {
      if (typeof gapi === 'undefined') return;
      gapi.load('picker', {
        callback: function () {
          pickerApiLoaded = true;
          google.script.run.withSuccessHandler(function (token) {
            oAuthTokenSecureStr = token;
            var pBtn = document.getElementById('link-picker-btn');
            if (pBtn) pBtn.disabled = false;
          }).GET_SYSTEM_OAUTH_TOKEN();
        }
      });
    }

    function launchSpreadsheetPicker() {
      if (!pickerApiLoaded || !oAuthTokenSecureStr) {
        showLinkError('Please wait, loading Drive components...');
        return;
      }
      var view = new google.picker.View(google.picker.ViewId.SPREADSHEETS);
      new google.picker.PickerBuilder()
        .addView(view)
        .setAppId("337774023280")
        .setDeveloperKey("AIzaSyCMHFpUHIVCgd8nviO88SdNWw1YWOtLqIs")
        .setOAuthToken(oAuthTokenSecureStr)
        .setOrigin(google.script.host.origin)
        .setSize(800, 600)
        .setTitle("Select Spreadsheet")
        .setCallback(function (data) {
          if (data.action === google.picker.Action.PICKED) {
            var doc = data.docs[0];
            google.script.run
              .withSuccessHandler(handleLinkResult)
              .withFailureHandler(function (err) {
                showLinkError(err.message || 'Could not link that spreadsheet.');
              })
              .LINK_SHEET_TO_TEMPLATE(doc.id);
          }
        })
        .build()
        .setVisible(true);
    }

    function renderLinkStatus(status) {
      var statusEl = document.getElementById('link-status');
      if (!statusEl) return;
      if (status && status.linked) {
        statusEl.innerHTML =
          'Linked to: <span class="linked-name">' + escapeHtml(status.sheetName || 'Unknown sheet') + '</span> ✅' +
          '<br><br>⚠️ Changing the sheet will remove existing variables from the sidebar, and the template might not work if variables don\'t match the new sheet\'s headers. It is suggested to clear all old variables before proceeding.';
        var btn = document.getElementById('link-picker-btn');
        if (btn) btn.textContent = '📂 Change Spreadsheet';
      } else {
        statusEl.textContent =
          'This template isn\'t connected to a data sheet yet. Link it to fetch its headers as variables.';
        var btn = document.getElementById('link-picker-btn');
        if (btn) btn.textContent = '📂 Browse Spreadsheet';
      }
    }

    function handleLinkResult(res) {
      if (res && res.success) {
        showLinkSuccess(
          '✅ Linked to "' + escapeHtml(res.sheetName || '') + '". Headers loaded!' +
          (res.matched !== undefined && res.unmatched !== undefined
            ? ' Matching variables: ' + res.matched.length + ' matched, ' + res.unmatched.length + ' unmatched.'
            : '')
        );
        renderLinkStatus({ linked: true, sheetName: res.sheetName });
        var smartCard = document.getElementById('smart-variable-card');
        if (smartCard) smartCard.style.display = '';
        var hint = document.getElementById('variables-hint');
        if (hint) hint.remove();
        populateDropdowns(res.headers);
      } else if (res && res.error) {
        showLinkError(res.error);
      }
    }

    function showLinkError(msg) {
      var errBox = document.getElementById('link-error');
      var okBox = document.getElementById('link-success');
      if (errBox) { errBox.textContent = '❌ ' + msg; errBox.style.display = 'block'; }
      if (okBox) okBox.style.display = 'none';
    }

    function showLinkSuccess(msg) {
      var errBox = document.getElementById('link-error');
      var okBox = document.getElementById('link-success');
      if (errBox) errBox.style.display = 'none';
      if (okBox) { okBox.textContent = msg; okBox.style.display = 'block'; }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>]/g, function (m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    initiateNativeGooglePickerLibraries();

    function toggleConditional(show) {
      document.getElementById('conditional-fields').classList.toggle('hidden', !show);
    }

    // Update the content input based on selected type
    function updateContentInput() {

      const type = document.getElementById('content-type').value;
      const container = document.getElementById('content-input-container');

      if (type === 'variable') {

        container.innerHTML = `
      <select id="content-value" class="header-dropdown"></select>

      <div class="form-group" style="margin-top:8px;">
        <label>Label (If you want any heading)</label>
        <input type="text" id="content-label" placeholder="e.g. Company">
      </div>
    `;

        const mainDropdown = document.getElementById('smart-dropdown');
        const contentDropdown = document.getElementById('content-value');

        for (let i = 0; i < mainDropdown.options.length; i++) {
          const option = document.createElement('option');
          option.value = mainDropdown.options[i].value;
          option.textContent = mainDropdown.options[i].textContent;
          contentDropdown.appendChild(option);
        }

      } else if (type === 'text') {

        container.innerHTML = `
      <input type="text"
             id="content-value"
             placeholder="Enter custom text...">
    `;

      } else {

        container.innerHTML = '';

      }
    }

    // Handle the insert action
function handleSmartInsert() {
  const variable = document.getElementById('smart-dropdown').value;
  const isConditional = document.querySelector('input[name="display-type"]:checked').value === 'conditional';

  // Get the content based on the selected type
  let content = "";
  const contentType = document.getElementById("content-type").value;

  if (contentType === "variable") {
    const selectedVar = document.getElementById("content-value").value;
    const labelEl = document.getElementById("content-label");
    const label = labelEl ? labelEl.value.trim() : "";

    if (label !== "") {
      content = `${label}: {${selectedVar}}`;
    } else {
      content = `{${selectedVar}}`;
    }
  } else if (contentType === "text") {
    content = document.getElementById("content-value").value;
  } else {
    content = "";
  }

  var insertSuccess = function(res) {
    if (res && res.success) {
      google.script.run
        .withFailureHandler(function(e) {})
        .showToast('✅ Variable inserted!');
    }
  };

  var insertFail = function(err) {
    alert('Error inserting variable: ' + err.message);
  };

  if (!isConditional) {
    // Simple variable insertion
    google.script.run
      .withSuccessHandler(insertSuccess)
      .withFailureHandler(insertFail)
      .injectTagAtCursor(`{${variable}}`, '');
  } else {
    const targetType = document.querySelector('input[name="target-type"]:checked').value;
    const op = document.getElementById('cond-operator').value;

    let val = "";
    if (op !== "empty" && op !== "notempty") {
      val = document.getElementById('cond-value').value;
    }

    let opening, closing;

    if (targetType === 'paragraph') {
      if (op === "empty" || op === "notempty") {
        opening = `<<If: {${variable}} ${op}>>`;
      } else {
        opening = `<<If: {${variable}} ${op} '${val}'>>`;
      }
      closing = '<<EndIf>>';
      google.script.run
        .withSuccessHandler(insertSuccess)
        .withFailureHandler(insertFail)
        .injectTagAtCursor(opening, closing, content);
    } else {
      if (op === "empty" || op === "notempty") {
        opening = `<<RowIf: {${variable}} ${op}>>${content}`;
      } else {
        opening = `<<RowIf: {${variable}} ${op} '${val}'>>${content}`;
      }
      closing = '';
      google.script.run
        .withSuccessHandler(insertSuccess)
        .withFailureHandler(insertFail)
        .injectTagAtCursor(opening, closing, '');
    }
  }
}
  </script>
</body>

</html>
